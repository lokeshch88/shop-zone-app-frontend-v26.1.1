name: Lightning Fast React S3 Deployment

on:
  push:
    branches: [ main ]

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Initialize Node Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm' # Bypasses fresh dependency downloads via caching mechanisms

    # FIX 1: CI=false ignores the unused Grid import error completely!
    # FIX 2: Compiling on GitHub avoids the slow drone-scp / server timeout loops entirely!
    - name: Package Build Bundles
      run: |
        npm install
        CI=false npm run build

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    # FIX 3: Native cloud synchronization pushes your build folder to S3 in under 15 seconds
    - name: Sync Static Assets directly to S3
      run: aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
