name: Deploy React Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 1: Install Node and build the React app FAST on GitHub's powerful servers
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm' # <-- This automatically caches your node_modules!
        
    - name: Install Dependencies and Build
      run: |
        npm install
        CI=false npm run build  # <--Prevents lint warnings from crashing the build!

    # Step 2: Copy ONLY the final lightweight HTML/JS 'build' folder and the 'Dockerfile' to AWS
    - name: Copy production build assets to AWS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.AWS_EC2_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "build/,Dockerfile"
        target: "~/shopzone/frontend"

    # Step 3: Connect to AWS via SSH, quickly build the Nginx container image, and run it
    - name: SSH and Launch Frontend Container
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        timeout: 20m # <--Increases the allowed step execution window to 20 minutes

        script: |
          cd ~/shopzone/frontend
          
          # Stop and remove old running container if present
          docker stop shopzone-frontend 2>/dev/null || true
          docker rm shopzone-frontend 2>/dev/null || true
          
          # Instantly builds the lightweight Nginx wrapper image
          docker build -t shopzone-frontend .
          
          # Spin it up on Port 80 inside our shared network space
          docker run -d \
            --name shopzone-frontend \
            --network shopzone-network \
            -p 80:80 \
            shopzone-frontend
