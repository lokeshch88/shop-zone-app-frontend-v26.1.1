name: Deploy React Frontend to Amazon S3

on:
  push:
    branches: [main]

jobs:
  compile-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workspace Code
        uses: actions/checkout@v4

      - name: Initialize Node Environment
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Package Build Bundles
        run: |
          npm install
          npm run build

      # Configure AWS CLI authentication parameters dynamically on the runner
      - name: Configure AWS Cloud Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # Syncs your compiled static build assets straight into your public S3 Bucket
      - name: Push Static Assets to Amazon S3
        run: aws s3 sync build/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} --delete
