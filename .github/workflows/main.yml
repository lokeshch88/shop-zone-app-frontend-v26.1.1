name: Deploy React Frontend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Copies your frontend workspace source code over to the AWS machine
    - name: Copy project files to AWS
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.AWS_EC2_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        source: "package*.json,src/,public/,Dockerfile"
        target: "~/shopzone/frontend"

    # Connects to AWS, triggers the multi-stage Nginx container build, and opens Port 80
    - name: SSH and Launch Frontend Container
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_EC2_IP }}
        username: ec2-user
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          cd ~/shopzone/frontend
          # Stop and remove old version if running
          docker stop shopzone-frontend || true
          docker rm shopzone-frontend || true
          
          # Build the production-ready optimized Nginx image
          docker build -t shopzone-frontend .
          
          # Run frontend container mapping Port 80 directly to public web traffic
          docker run -d \
            --name shopzone-frontend \
            --network shopzone-network \
            -p 80:80 \
            shopzone-frontend
